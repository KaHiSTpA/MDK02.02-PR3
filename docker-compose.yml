version: '3.8'

services:
  # --- Веб-приложение: в обеих сетях ---
  web:
    build: .
    container_name: flask_web
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - FLASK_DEBUG=1
    volumes:
      - ./:/app
    networks:
      - frontend       # ← доступен извне
      - backend        # ← может общаться с БД
    depends_on:
      - db

  # --- База данных: только backend ---
  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend        # ← только в приватной сети!
    # ❌ НЕТ секции "ports" — снаружи недоступна!

  # --- pgAdmin: тоже backend ---
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    ports:
      - "8080:80"      # ← оставим доступ, чтобы вы могли зайти в браузере
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    networks:
      - backend
    depends_on:
      - db

# --- Объявление пользовательских сетей ---
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  pgdata: